<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#d97706" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4"/>
  
  <!-- Shield Emblem -->
  <path d="M256 96 L376 144 V264 C376 344 256 416 256 416 C256 416 136 344 136 264 V144 Z" 
        fill="#1e293b" 
        stroke="url(#goldGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
  
  <!-- Scales of Justice / Key / Monogram inside Shield -->
  <!-- Pillar / Balance Center -->
  <path d="M256 168 V336 M216 336 H296 M236 348 H276" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
  <!-- Crossbar -->
  <path d="M192 196 H320" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
  <!-- Left Pan -->
  <path d="M192 196 L168 252 M192 196 L216 252 M160 252 H224 C224 268 160 268 160 252 Z" stroke="url(#goldGrad)" stroke-width="6" fill="#d97706" fill-opacity="0.3" stroke-linejoin="round"/>
  <!-- Right Pan -->
  <path d="M320 196 L296 252 M320 196 L344 252 M288 252 H352 C352 268 288 268 288 252 Z" stroke="url(#goldGrad)" stroke-width="6" fill="#d97706" fill-opacity="0.3" stroke-linejoin="round"/>
  <!-- Crown / Star on Top -->
  <polygon points="256,128 262,146 280,146 265,157 271,174 256,163 241,174 247,157 232,146 250,146" fill="url(#goldGrad)"/>
</svg>
